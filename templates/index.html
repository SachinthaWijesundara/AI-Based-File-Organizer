<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>File Organizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="glow"></div>
<main class="container">
  <header class="header">
    <div class="badge"><span class="dot"></span>Runs locally on your machine</div>
    <h1>Clean up any folder<br><span class="grad">in a single click</span></h1>
    <p class="subtitle">Point it at a folder and every loose file is sorted into tidy category folders. Your existing subfolders are never touched, nothing is duplicated, and same-name files are renamed instead of overwritten.</p>
  </header>

  <div class="options">
    <button class="card" data-mode="extension">
      <div class="card-top">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7.5A1.5 1.5 0 0 1 4.5 6h4l2 2.5h9a1.5 1.5 0 0 1 1.5 1.5v7.5a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z"/>
          </svg>
        </div>
        <span class="tag ready">Ready</span>
      </div>
      <h2>Extension sort</h2>
      <p>Sorts by file type alone. Documents, Images, Videos, Audio, Archives and Programs, with anything unrecognised placed in Other.</p>
      <span class="action">Choose folder<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg></span>
    </button>

    <button class="card" data-mode="ai">
      <div class="card-top">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/>
            <path d="M18 16l.7 1.8L20.5 18.5l-1.8.7L18 21l-.7-1.8-1.8-.7 1.8-.7z"/>
          </svg>
        </div>
        <span class="tag ready">Ready</span>
      </div>
      <h2>AI sort</h2>
      <p>Reads names and contents to group files by what they actually are, so university work, invoices and personal notes land apart.</p>
      <span class="action">Choose folder<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5L10.5 8 6 12.5"/></svg></span>
    </button>

    <button class="card" data-mode="both" disabled>
      <div class="card-top">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l8 4.5-8 4.5-8-4.5z"/>
            <path d="M4 12l8 4.5 8-4.5"/>
            <path d="M4 16.5L12 21l8-4.5"/>
          </svg>
        </div>
        <span class="tag">Soon</span>
      </div>
      <h2>Extension, then AI</h2>
      <p>Sorts by type first, then splits each category into meaningful subfolders. The full two-pass organiser.</p>
      <span class="action muted">Not built yet</span>
    </button>
  </div>

  <div class="status" id="status" hidden>
    <span class="spinner" id="spinner"></span>
    <p id="statusText"></p>
  </div>
</main>
<script src="/static/script.js"></script>
</body>
</html>
